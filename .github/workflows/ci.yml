name: Finanzauto CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilación, formato y Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore Finanzauto.slnx

      - name: Compilar en Release
        run: dotnet build Finanzauto.slnx --configuration Release --no-restore

      - name: Validar formato
        run: dotnet format Finanzauto.slnx --verify-no-changes --no-restore

      - name: Construir imagen de la API
        run: docker build --file Finanzauto/Dockerfile --tag finanzauto-api:ci .

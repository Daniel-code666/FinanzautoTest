name: Finanzauto CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilación, formato y Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore Finanzauto.slnx

      - name: Compilar en Release
        run: dotnet build Finanzauto.slnx --configuration Release --no-restore

      - name: Validar formato
        run: dotnet format Finanzauto.slnx --verify-no-changes --no-restore

      - name: Construir imagen de la API
        run: docker build --file Finanzauto/Dockerfile --tag finanzauto-api:ci .

  smoke:
    name: API y PostgreSQL con secrets
    needs: build
    environment: FinanzautoEnv
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      CI_JWT_SIGNING_KEY: ${{ secrets.CI_JWT_SIGNING_KEY }}
      CI_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.CI_BOOTSTRAP_ADMIN_PASSWORD }}
      CI_BOOTSTRAP_ADMIN_EMAIL: ${{ vars.CI_BOOTSTRAP_ADMIN_EMAIL }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verificar arranque, login y JWT
        run: python3 .github/scripts/smoke.py

      - name: Eliminar entorno temporal
        if: always()
        run: docker compose --env-file /dev/null -f compose.ci.yml -p finanzauto-ci down --volumes --remove-orphans
